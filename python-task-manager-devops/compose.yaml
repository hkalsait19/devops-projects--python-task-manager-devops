version: "3.8"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task-manager-app

    ports:
      - "5151:5151"

    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5151/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:

    image: postgres:16

    container_name: task-manager-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:

  postgres_data: