## GitHub Actions workflow for Python Task Manager CI

name: Python Task Manager CI

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Run Python Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v