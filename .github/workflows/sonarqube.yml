name: Task Manager - SonarQube Quality Analysis

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --only-binary=:all: -r python-task-manager-devops/requirements.txt

      - name: Install testing dependencies
        run: |
          python -m pip install --only-binary=:all: \
            -r python-task-manager-devops/requirements-dev.txt \
            -c python-task-manager-devops/requirements.txt

      - name: Run tests and generate coverage
        working-directory: python-task-manager-devops
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=hkalsait19_devops-projects--python-task-manager-devops
            -Dsonar.qualitygate.wait=true